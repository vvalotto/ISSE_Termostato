[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "termostato-core"
version = "1.0.0"
description = "Sistema de Control de Climatización para Raspberry Pi"
readme = "README.md"
requires-python = ">=3.5"
license = {text = "MIT"}
keywords = ["termostato", "raspberry-pi", "iot", "control", "climatizacion"]
authors = [
  {name = "Victor Valotto", email = "vvalotto@example.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "radon>=5.1.0", "pylint>=2.15.0"]
rpi = []

[project.urls]
Homepage = "https://github.com/vvalotto/ISSE_Termostato"
Documentation = "https://github.com/vvalotto/ISSE_Termostato/docs"
Repository = "https://github.com/vvalotto/ISSE_Termostato"
"Bug Tracker" = "https://github.com/vvalotto/ISSE_Termostato/issues"

[project.scripts]
termostato = "ejecutar:main"

[tool.setuptools]
packages = [
    "entidades",
    "servicios_dominio",
    "gestores_entidades",
    "servicios_aplicacion",
    "agentes_sensores",
    "agentes_actuadores",
    "configurador",
    "registrador"
]

[tool.setuptools.package-data]
configurador = ["termostato.json"]

# =============================================================================
# software_limpio — Agentes de calidad automatizados
# Requiere: pip install git+https://github.com/vvalotto/software_limpio.git
# (en un virtualenv separado con Python 3.11+)
# =============================================================================

[tool.codeguard]
# Advierte sin bloquear (pre-commit)
max_complexity = 10
max_line_length = 120

[tool.designreviewer]
# Bloquea en CRITICAL — umbrales calibrados para este proyecto
# Configurador tiene WMC=19, lo dejamos con margen
max_cbo = 6
max_wmc = 22
max_dit = 3

[tool.architectanalyst]
# Capas de la Clean Architecture del proyecto
# Las dependencias deben apuntar hacia adentro (dominio)
max_instability = 0.8
max_distance_critical = 0.5
exclude_patterns = [
    "__pycache__",
    ".venv",
    ".venv-quality",
    "venv",
    ".claude",
    "Test",
    "test_",
    "conftest",
    "dist",
    "build",
    "actores_externos",
    "docs",
    "scripts",
]

[tool.architectanalyst.layers]
# L0 - Entities: dependencia horizontal entre si permitida
entidades = ["servicios_dominio"]
servicios_dominio = []
# L1 - Use Cases: solo dependen de L0
gestores_entidades = ["entidades", "servicios_dominio"]
servicios_aplicacion = ["entidades", "servicios_dominio", "gestores_entidades"]
# L2 - Adapters: dependen de L0 y L1, y entre si (horizontal)
agentes_sensores = ["entidades", "servicios_dominio"]
agentes_actuadores = ["entidades", "servicios_dominio"]
configurador = ["entidades", "servicios_dominio", "agentes_sensores", "agentes_actuadores", "registrador"]
registrador = []
